name: Publish daily blockchain brief

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Build the HTML brief
        run: |
          python3 - <<'PY'
          import datetime
          import html
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          feed_url = "https://www.coindesk.com/arc/outboundfeeds/rss/"
          root = ET.fromstring(urllib.request.urlopen(feed_url, timeout=30).read())
          keywords = ("bitcoin", "crypto", "blockchain", "ethereum", "stablecoin", "token", "defi", "web3", "ripple", "solana", "binance")
          stories = []
          for item in root.findall("./channel/item"):
              title = (item.findtext("title") or "").strip()
              link = (item.findtext("link") or "").strip()
              published = (item.findtext("pubDate") or "").strip()
              if title and link and any(word in title.lower() for word in keywords):
                  stories.append((title, link, published))
              if len(stories) == 5:
                  break
          if len(stories) < 5:
              raise SystemExit("Could not collect five blockchain stories")

          today = datetime.datetime.now(datetime.UTC).date().isoformat()
          cards = "".join(
              f'<article><div class="number">{n:02d}</div><h2>{html.escape(title)}</h2>'
              f'<p>CoinDesk RSS · {html.escape(published)}</p>'
              f'<a href="{html.escape(link, quote=True)}">Read original report →</a></article>'
              for n, (title, link, published) in enumerate(stories, 1)
          )
          page = f'''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blockchain Brief | {today}</title><style>:root{{color-scheme:dark;--bg:#07111f;--card:#0d1b2d;--line:#243752;--text:#eaf1fb;--muted:#9bb0ca;--mint:#56d6bd;--link:#75b8ff}}*{{box-sizing:border-box}}body{{margin:0;background:radial-gradient(circle at 90% 0%,#17385a,transparent 32rem),var(--bg);color:var(--text);font:16px/1.65 system-ui,sans-serif}}main{{max-width:900px;margin:auto;padding:72px 24px}}.eyebrow,.number{{color:var(--mint);font-weight:800;letter-spacing:.1em}}h1{{font-size:clamp(2.25rem,6vw,4.5rem);line-height:1.05;margin:.5rem 0 1rem}}.intro,p,footer{{color:var(--muted)}}section{{display:grid;gap:14px;margin-top:2.5rem}}article{{background:linear-gradient(110deg,#11253d,#091728);border:1px solid var(--line);border-radius:18px;padding:24px}}h2{{font-size:1.25rem;line-height:1.35;margin:.3rem 0 .6rem}}a{{color:var(--link)}}footer{{border-top:1px solid var(--line);margin-top:3rem;padding-top:1.25rem;font-size:.88rem}}</style></head><body><main><div class="eyebrow">HAPPYDA PUBLIC · DAILY BRIEF</div><h1>Blockchain Brief<br>{today}</h1><p class="intro">Five recent blockchain-related stories, selected from CoinDesk's public RSS feed.</p><section>{cards}</section><footer>Source: CoinDesk RSS. For information only; not investment, legal, or financial advice.</footer></main></body></html>'''
          Path(f"blockchain-brief-{today}.html").write_text(page, encoding="utf-8")
          PY

      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blockchain-brief-*.html
          if git diff --cached --quiet; then
            echo "No new report to publish"
          else
            git commit -m "feat: publish daily blockchain brief"
            git push
          fi
